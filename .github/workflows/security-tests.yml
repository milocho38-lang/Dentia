name: Dentia Security Tests

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  security-characterization:
    name: Security characterization
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dentia_test
          POSTGRES_USER: dentia_test
          POSTGRES_PASSWORD: dentia_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dentia_test -d dentia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DENTIA_TEST_DATABASE_CONFIRMATION: DENTIA_TEST_DATABASE_CONFIRMED
      DATABASE_URL: postgresql+psycopg://dentia_test:dentia_test_password@127.0.0.1:5432/dentia_test
      JWT_SECRET: dentia-test-secret-that-is-long-enough-for-ci-security-tests
      BRANDING_STORAGE_DIR: /tmp/dentia-security-storage/branding
      DENTIA_TEST_STORAGE_ROOT: /tmp/dentia-security-storage
      PYTHONPATH: ${{ github.workspace }}/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The Docker release-path test starts from the currently deployed
          # production SHA before fast-forwarding to the candidate.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend and test dependencies
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/pip install --upgrade pip
          backend/.venv/bin/pip install -r backend/requirements.txt -r backend/requirements-test.txt

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run official security and hardening suites
        run: |
          ./scripts/local/test_deploy_dentia_maintenance.sh
          ./scripts/local/test_dentia_security.sh --full

      - name: Validate clinical-file frontend state and production build
        run: |
          node frontend/scripts/clinical-file-upload-state-tests.mjs
          npm run build --prefix frontend

      - name: Exercise the 0049 to 0050 Docker deployment path
        run: ./scripts/local/test_deploy_dentia_docker_integration.sh success
